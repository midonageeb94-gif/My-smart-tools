<!DOCTYPE html><html lang='ar' dir='rtl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>حاسبة زكاة الفطر 2024 - مصر والسعودية</title><meta name='description' content='احسب قيمة زكاة الفطر بدقة في مصر والسعودية باستخدام حاسبتنا المجانية. معرفة مقدار الصاع بالجرام والقيمة النقدية.'><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap' rel='stylesheet'><script src='https://cdn.tailwindcss.com'></script><script type='application/ld+json'>{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "كيف يتم حساب زكاة الفطر؟", "acceptedAnswer": {"@type": "Answer", "text": "يتم حسابها بناءً على صاع من طعام (حوالي 2.5 كجم) من غالب قوت البلد."}}]}</script><style>body { font-family: 'Cairo', sans-serif; }</style></head><body class='bg-slate-50'><nav class='p-4 bg-white shadow-sm'><a href='/' class='text-blue-600 font-bold'>الرئيسية</a></nav><div class='max-w-2xl mx-auto p-4'><div id='ad-slot-top' class='w-full min-h-[90px] bg-slate-100 border border-dashed border-slate-300 rounded-xl flex items-center justify-center text-xs text-slate-400 my-6'>Ad Space</div><h1 class='text-2xl font-bold mb-6'>حاسبة زكاة الفطر</h1><div class='bg-white p-6 rounded-xl shadow-md'><label class='block mb-2'>عدد أفراد الأسرة:</label><input type='number' id='members' class='w-full p-2 border rounded mb-4' value='1'><label class='block mb-2'>قيمة الصاع (بالعملة المحلية):</label><input type='number' id='price' class='w-full p-2 border rounded mb-4' placeholder='مثلاً 30'> <button onclick='calculate()' class='w-full bg-blue-600 text-white py-2 rounded'>احسب</button><div id='result' class='mt-4 font-bold text-lg'></div><button onclick='reset()' class='mt-2 text-sm text-slate-500'>إعادة تعيين</button></div><div id='ad-slot-bottom' class='w-full min-h-[250px] bg-slate-100 border border-dashed border-slate-300 rounded-xl flex items-center justify-center text-xs text-slate-400 my-6'>Ad Space</div></div><script>function calculate(){const members=document.getElementById('members').value;const price=document.getElementById('price').value;const total=members*price;document.getElementById('result').innerText='إجمالي زكاة الفطر الواجبة: ' + total;}function reset(){document.getElementById('members').value=1;document.getElementById('price').value='';document.getElementById('result').innerText='';}</script><script src='/ads.js'></script></body></html>
