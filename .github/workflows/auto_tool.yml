name: Auto Tool Factory

on:
  schedule:
    # يعمل تلقائياً كل يوم الساعة 10 صباحاً بتوقيت UTC (12 ظهراً بتوقيت القاهرة)
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      custom_idea:
        description: 'فكرة أداة محددة (اختياري للتشغيل اليدوي)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-tool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate New Tool & Update Feeds
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CUSTOM_IDEA: ${{ github.event.inputs.custom_idea }}
        run: python generator.py

      - name: Commit and Push New Tool
        run: |
          git config user.name "AutoToolsBot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git commit -m "Auto-generated new micro-tool" || exit 0
          git fetch origin main
          git merge -s recursive -X ours origin/main -m "Merge remote changes" || true
          git push origin main
